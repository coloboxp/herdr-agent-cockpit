name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check release versions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          assert version == Path('mods/project-history/VERSION').read_text().strip()
          print(version)
          PY
      - name: Check JavaScript syntax
        run: node --check mods/project-history/main.js
      - name: Test model
        run: node --test tests/*.test.mjs
      - name: Test collector and installer
        run: python -B -m unittest discover -s tests -p 'test_*.py'
